version: 2

models:
  - name: stg_ree__pvpc
    description: "Vista de staging con precios horarios PVPC (indicador 1001) en €/kWh y hora local Europe/Madrid."
    columns:
      - name: fecha_hora_pk
        description: "Fecha y hora local (Europe/Madrid) en formato TIMESTAMP_NTZ."
        data_tests:
          - not_null
      - name: precio_eur_kwh
        description: "Precio oficial PVPC convertido a €/kWh."
        data_tests:
          - not_null

  - name: stg_openmeteo__prediccion_horaria
    description: "Vista de staging con previsión meteorológica horaria de Open-Meteo para Granada."
    columns:
      - name: fecha_hora_pk
        description: "Fecha y hora local (Europe/Madrid) en formato TIMESTAMP_NTZ."
        data_tests:
          - not_null
      - name: temperatura_ext_c
        description: "Temperatura exterior prevista a 2 metros (°C)."
        data_tests:
          - not_null
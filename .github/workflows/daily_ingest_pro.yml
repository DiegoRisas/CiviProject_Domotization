name: Daily Ingest APIs to PRO Bronze

on:
  schedule:
    # 19:43 UTC = 20:43 invierno (CET) / 21:43 verano (CEST)
    # Evita el minuto :00 y da más de 3h de margen antes de medianoche
    - cron: '43 19 * * *'
  workflow_dispatch:
    inputs:
      days_offset:
        description: 'auto = inteligente, 0 = hoy, 1 = mañana (tras las 20:30)'
        required: true
        default: 'auto'
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests snowflake-connector-python

      - name: Run ingestion to DOMO_PRO_BRONZE_DB
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          HOME_CITY: 'Granada'
          HOME_LAT: '37.1773'
          HOME_LON: '-3.5986'
          DAYS_OFFSET: ${{ github.event.inputs.days_offset || 'auto' }}
        run: python ingestion/ingest_pro_bronze.py